[build-system]
requires = ["setuptools>=68"]

[project]
name = "demand-analyzer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0,<2.0",
    "redis[asyncio]>=5.0,<6.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
]

[project.scripts]
demand-analyzer = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
